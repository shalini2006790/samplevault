<!DOCTYPE html><html><head><title>SampleVault Login</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="container" style="max-width: 400px; margin-top: 10vh;">
    <div class="card" style="text-align: center;">
        <img src="assets/logo.webp" alt="Logo" style="width:120px; margin-bottom: 15px;">
        <h2 style="color:var(--accent); margin:0;">SampleVault</h2>
        <p style="color:var(--text-muted); margin-bottom: 20px;">Secure. Track. Analyze.</p>
        <form id="loginForm" style="text-align: left;">
            <div class="form-group"><label>Role</label><select id="role"><option value="RESEARCH_SCHOLAR">Research Scholar</option><option value="LAB_HEAD">Lab Head</option></select></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
            <button type="submit" class="btn" style="width: 100%;">Authenticate</button>
        </form>
        <p style="margin-top:20px; font-size:14px;"><a href="register.html" style="color:var(--accent); text-decoration:none;">Don't have an account? Register</a></p>
    </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
        const data = await login(document.getElementById('email').value, document.getElementById('password').value);
        window.location.href = data.role === 'LAB_HEAD' ? 'labhead_dashboard.html' : 'scholar_dashboard.html';
    } catch(err) { alert('Invalid credentials'); }
};
</script></body></html>
