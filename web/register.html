<!DOCTYPE html><html><head><title>Register</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="container" style="max-width: 500px; margin-top: 5vh;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="assets/logo.webp" style="width:80px;">
            <h2 style="color:var(--accent); margin:0;">Register Account</h2>
        </div>
        <form id="regForm">
            <div class="form-group"><label>Full Name</label><input type="text" id="r_name" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="r_email" required></div>
            <div class="form-group"><label>Phone</label><input type="text" id="r_phone" required></div>
            <div class="form-group"><label>Institution</label><input type="text" id="r_inst" required></div>
            <div class="form-group"><label>Role</label><select id="r_role"><option value="RESEARCH_SCHOLAR">Research Scholar</option><option value="LAB_HEAD">Lab Head</option></select></div>
            <div class="form-group"><label>Password</label><input type="password" id="r_pass" required></div>
            <button type="submit" class="btn btn-green" style="width: 100%; margin-top:10px;">Create Account</button>
        </form>
        <p style="text-align:center; margin-top:15px;"><a href="index.html" style="color:var(--accent); text-decoration:none;">Already have an account? Login</a></p>
    </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = { full_name: document.getElementById('r_name').value, email: document.getElementById('r_email').value, phone: document.getElementById('r_phone').value, institution: document.getElementById('r_inst').value, password: document.getElementById('r_pass').value, role: document.getElementById('r_role').value };
    try { await register(data); alert('Registered! Please login.'); window.location.href='index.html'; } catch(err) { alert('Registration failed.'); }
};
</script></body></html>
